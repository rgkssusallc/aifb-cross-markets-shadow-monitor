# Add this block to docker/docker-compose.yml, pattern-matched against the
# existing `chain-listener` service.
#
# No `ports:` -- a pure outbound worker, same as chain-listener,
# candidate-watcher and time-series-collector. If a future pass adds an HTTP
# surface (e.g. a manual "track this pump.fun token" endpoint), the next free
# host port in the 811x convention is 8117; everything through 8116
# (operations) is taken.
#
# PUMPFUN_COLLECTOR_ENABLED is a kill switch and defaults to false: unset,
# blank, or anything other than exactly "true" means the process starts, logs
# its effective config once, and sleeps forever making ZERO RPC calls. That is
# the only safe way to ship a new chain's ingestion into a running system.

chain-listener-pumpfun:
  build:
    context: ..
    dockerfile: docker/agents/Dockerfile
  restart: unless-stopped
  command: python -m src.adapters.launchpads.pumpfun.main
  environment:
    SOLANA_NETWORK: ${SOLANA_NETWORK:-mainnet-beta}
    # Primary + fallbacks, following the existing {PREFIX}_HTTP_URL /
    # _SECONDARY_n convention. NON_EVM_SOL_RPC_URL is also recognised as a
    # fallback because that is the name this deployment already uses.
    SOLANA_RPC_HTTP_URL: ${SOLANA_RPC_HTTP_URL}
    SOLANA_RPC_HTTP_URL_SECONDARY_1: ${SOLANA_RPC_HTTP_URL_SECONDARY_1}
    NON_EVM_SOL_RPC_URL: ${NON_EVM_SOL_RPC_URL}
    # Not yet used -- no Geyser provider chosen. Present so enabling one is a
    # config change rather than a code change. See design doc section 5.
    SOLANA_GEYSER_GRPC_URL: ${SOLANA_GEYSER_GRPC_URL}
    SOLANA_GEYSER_GRPC_TOKEN: ${SOLANA_GEYSER_GRPC_TOKEN}
    PUMPFUN_COLLECTOR_ENABLED: ${PUMPFUN_COLLECTOR_ENABLED:-false}
    PUMPFUN_COLD_START_SIGNATURES: ${PUMPFUN_COLD_START_SIGNATURES:-1000}
    PUMPFUN_HEARTBEAT_INTERVAL_S: ${PUMPFUN_HEARTBEAT_INTERVAL_S:-60}
    # USDC-quoted coins are skipped by default; see the design doc's non-goals.
    PUMPFUN_ALLOW_TOKEN_QUOTES: ${PUMPFUN_ALLOW_TOKEN_QUOTES:-false}
    OPERATIONS_URL: ${OPERATIONS_URL:-http://operations:8116}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD}
  depends_on:
    redis:
      condition: service_healthy
